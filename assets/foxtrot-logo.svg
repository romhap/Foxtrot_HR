<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="foxLight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ff5aa8"/>
      <stop offset="100%" stop-color="#ec1a7e"/>
    </linearGradient>
    <linearGradient id="foxDark" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d10e6d"/>
      <stop offset="100%" stop-color="#9e0854"/>
    </linearGradient>
    <radialGradient id="foxGlow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft glow halo -->
  <circle cx="32" cy="34" r="30" fill="url(#foxGlow)"/>

  <!-- Left ear (outer) -->
  <path d="M6 5 L24 16 L15 30 Z" fill="url(#foxDark)"/>
  <!-- Left ear (inner highlight) -->
  <path d="M12 11 L22 18 L16 26 Z" fill="url(#foxLight)"/>

  <!-- Right ear (outer) -->
  <path d="M58 5 L40 16 L49 30 Z" fill="url(#foxDark)"/>
  <!-- Right ear (inner highlight) -->
  <path d="M52 11 L42 18 L48 26 Z" fill="url(#foxLight)"/>

  <!-- Head: rounded pentagon -->
  <path d="M10 20
           L32 10
           L54 20
           L46 50
           Q32 60 18 50 Z"
        fill="url(#foxLight)"/>

  <!-- Side shadows for depth -->
  <path d="M10 20 L18 50 Q14 44 12 36 Z" fill="url(#foxDark)" opacity="0.55"/>
  <path d="M54 20 L46 50 Q50 44 52 36 Z" fill="url(#foxDark)" opacity="0.55"/>

  <!-- White triangular muzzle -->
  <path d="M20 32 L44 32 L32 56 Z" fill="#ffffff"/>

  <!-- Eyes -->
  <ellipse cx="22" cy="28" rx="2.4" ry="3.2" fill="#1a0022"/>
  <ellipse cx="42" cy="28" rx="2.4" ry="3.2" fill="#1a0022"/>
  <circle cx="22.8" cy="27.1" r="0.8" fill="#ffffff"/>
  <circle cx="42.8" cy="27.1" r="0.8" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M28 34 L36 34 L32 41 Z" fill="#1a0022"/>
</svg>
